[package]
name = "helix-dap-vars"
version = "0.1.0"
edition = "2021"
description = "A transparent DAP proxy that writes the stopped frame's variables to a text file"
license = "LGPL-3.0-or-later"

[[bin]]
name = "helix-dap-vars"
path = "src/main.rs"

[dependencies]
# The wire format is JSON; hand-rolling a parser for it would be worse code,
# not less dependency.
serde_json = "1"

[profile.release]
strip = true
