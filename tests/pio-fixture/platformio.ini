; Fixture project for the cog's PlatformIO support. `platform = native`
; builds and runs the Unity tests with the host toolchain, so the check needs
; no microcontroller attached.

[env:native]
platform = native
test_framework = unity

; An embedded environment, for the firmware half of the check. The toolchain
; for it is installed locally, so this builds offline.
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
